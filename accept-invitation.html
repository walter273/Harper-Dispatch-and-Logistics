<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Set Up Your Account | Harper Dispatch and Logistics</title>
  <link href="./css2" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./account-setup.css">
  <script src="./accept-invitation.js" defer></script>
<link rel="stylesheet" href="./harper-theme.css">
</head>
<body>
  <main class="page-shell account-setup-shell">
    <header class="topbar portal-topbar"><a class="brand" href="./index.html" aria-label="Harper Dispatch and Logistics home"><span class="harper-emblem" aria-hidden="true"></span><span class="brand-copy"><span class="brand-name">Harper Load Board</span><small>Powered by Harper Dispatch and Logistics</small></span></a><a class="ghost-button" href="./workspace.html">Sign in</a></header>
    <section class="portal-panel account-setup-panel">
      <p class="eyebrow">Your team invitation</p><h1>Set up your account</h1>
      <p id="invitationSummary" class="tool-note">Checking your invitation…</p>
      <form id="acceptInvitationForm" class="operations-form" hidden>
        <label><span>Email</span><input id="invitationEmail" type="email" autocomplete="username" readonly></label>
        <label><span>Your name</span><input name="name" autocomplete="name" maxlength="120" required></label>
        <label><span>Create a password</span><input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="256" aria-describedby="passwordHelp" required></label>
        <label><span>Confirm your password</span><input name="confirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="256" required></label>
        <p id="passwordHelp" class="tool-note">Use at least 10 characters. Choose a password that you use only for this account.</p>
        <button class="primary-button" type="submit">Create my account</button>
      </form>
      <p id="acceptInvitationStatus" class="form-status" role="status" aria-live="polite"></p>
      <p class="tool-note">Already created your account? <a class="account-setup-signin" href="./workspace.html">Sign in here</a>.</p>
    </section>
  </main>
</body>
</html>
