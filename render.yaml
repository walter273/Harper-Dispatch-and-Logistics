services:
  - type: web
    name: alphaway-logistics-preview
    runtime: node
    plan: free
    region: oregon
    numInstances: 1
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: ALPHAWAY_HOST
        value: 0.0.0.0
      - key: ALPHAWAY_DATA_FILE
        value: /tmp/alphaway-store.json
      - key: ALPHAWAY_REQUIRE_AUTH
        value: "true"
      - key: ALPHAWAY_PREVIEW_USERNAME
        sync: false
      - key: ALPHAWAY_PREVIEW_PASSWORD
        sync: false
      - key: ALPHAWAY_ADMIN_TOKEN
        sync: false
      - key: ALPHAWAY_PRIVATE_NETWORK
        value: "true"
      - key: ALPHAWAY_NETWORK_INVITE_CODE
        sync: false
      - key: ALPHAWAY_FMCSA_QCMOBILE_KEY
        sync: false
      - key: ALPHAWAY_FMCSA_BASE_URL
        value: https://mobile.fmcsa.dot.gov/qc/services
      - key: ALPHAWAY_ACCOUNT_AUTH
        value: "true"
      - key: ALPHAWAY_ACCOUNT_SESSION_SECRET
        sync: false
      - key: ALPHAWAY_ADMIN_EMAIL
        sync: false
      - key: ALPHAWAY_ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_CARRIER
        sync: false
      - key: STRIPE_PRICE_SHIPPER
        sync: false
      - key: STRIPE_PRICE_BROKER
        sync: false
      - key: STRIPE_SUCCESS_URL
        value: https://alphaway-logistics-preview.onrender.com/workspace.html?billing=success
      - key: STRIPE_CANCEL_URL
        value: https://alphaway-logistics-preview.onrender.com/#plans
